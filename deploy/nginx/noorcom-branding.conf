# Noorcom Branding website (docs/VPS_BRANDING.md section 6).
# deploy-branding.sh --install writes this to /etc/nginx/sites-available/noorcom-branding.conf,
# filling in SITE_HOST from /etc/noorcom-branding/hosts.env, and keeps the WWW block below only
# when hosts.env sets WWW_HOST (the live site: www.noorcombranding.co.ke goes to the bare name).
# Staging first (staging.noorcombranding.co.ke), the live names at cutover. Certificates: certbot.
server {
    listen 80;
    listen [::]:80;
    server_name SITE_HOST;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://SITE_HOST$request_uri; }
}

# WWW-BEGIN (kept only when hosts.env sets WWW_HOST): www goes to the bare name, path kept.
server {
    listen 80;
    listen [::]:80;
    server_name WWW_HOST;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://SITE_HOST$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name WWW_HOST;
    ssl_certificate     /etc/letsencrypt/live/SITE_HOST/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SITE_HOST/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    return 301 https://SITE_HOST$request_uri;
}
# WWW-END

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name SITE_HOST;
    ssl_certificate     /etc/letsencrypt/live/SITE_HOST/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SITE_HOST/privkey.pem;
    access_log /var/log/nginx/noorcom-branding.access.log;
    error_log  /var/log/nginx/noorcom-branding.error.log;

    # The other security headers come from the site itself (next.config.ts).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # NOINDEX-BEGIN (kept only when hosts.env sets NOINDEX=yes): staging stays out of search results.
    add_header X-Robots-Tag "noindex, nofollow" always;
    # NOINDEX-END

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # Hashed build files never change: cache them for a year. (A location with its own add_header
    # drops the server's, so HSTS is repeated here.)
    location /_next/static/ {
        proxy_pass http://127.0.0.1:4301;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    }

    location / {
        proxy_pass http://127.0.0.1:4301;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
