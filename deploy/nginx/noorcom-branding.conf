# Noorcom Branding website (RUNBOOK.md, "Deploying to the VPS").
# deploy-branding.sh --install copies this to /etc/nginx/sites-available/noorcom-branding and
# replaces SITE_HOST and WWW_HOST from /etc/noorcom-branding/hosts.env (staging names first; at
# cutover noorcombranding.co.ke and www.noorcombranding.co.ke). The certificate comes from certbot.
server {
    listen 80;
    listen [::]:80;
    server_name SITE_HOST WWW_HOST;
    location /.well-known/acme-challenge/ { root /var/www/letsencrypt; }
    location / { return 301 https://SITE_HOST$request_uri; }
}

# www -> the bare domain, one canonical address.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name WWW_HOST;
    ssl_certificate     /etc/letsencrypt/live/SITE_HOST/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SITE_HOST/privkey.pem;
    return 301 https://SITE_HOST$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name SITE_HOST;
    ssl_certificate     /etc/letsencrypt/live/SITE_HOST/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/SITE_HOST/privkey.pem;
    access_log /var/log/nginx/noorcom-branding.access.log;
    error_log  /var/log/nginx/noorcom-branding.error.log;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain application/xml;

    # Hashed build files never change: cache them for a year.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:4301;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:4301;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
